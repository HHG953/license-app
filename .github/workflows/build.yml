name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk
          pip install buildozer cython

            - name: Build with Buildozer
        run: |
          buildozer init
          sed -i 's/^requirements = .*/requirements = python3,kivy==2.2.1,pycryptodome/' buildozer.spec
          sed -i 's/^# android.api = .*/android.api = 33/' buildozer.spec
          sed -i 's/^# android.minapi = .*/android.minapi = 21/' buildozer.spec
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: bin/*.apk
